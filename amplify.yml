version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install
            - npm run build --workspace=@tabvault/core
        build:
          commands:
            - npm run build --workspace=@tabvault/web
      artifacts:
        baseDirectory: packages/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - packages/core/dist/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: 'Strict-Transport-Security'
              value: 'max-age=31536000; includeSubDomains'
            - key: 'X-Frame-Options'
              value: 'SAMEORIGIN'
            - key: 'X-Content-Type-Options'
              value: 'nosniff'
