name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-apk:
    name: 🤖 Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 💎 Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: packages/mobile

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: ⚡ Build Shared Core Library
        run: npm run build --workspace=@tabvault/core

      - name: 🚀 Run Fastlane to Build Android Release APK
        working-directory: packages/mobile
        run: |
          cd fastlane
          bundle exec fastlane android build_apk

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: tabvault-release-apk
          path: packages/mobile/build/tabvault-release.apk

      - name: 🏷️ Publish GitHub Release with Downloadable APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: TabVault Release ${{ github.ref_name || inputs.release_tag }}
          body: |
            ## TabVault Mobile Android Release ⚡
            
            ### 📥 Download & Install
            Download **`tabvault-release.apk`** below directly to your Android device and install it.
            
            ### ✨ Features
            - **Local Wi-Fi P2P**: Direct WebRTC gigabit transfers from Mac, PC, or browsers.
            - **Universal Clipboard**: Instant sync across paired devices.
            - **Zero-Knowledge E2EE**: AES-256-GCM client-side encryption.
            - **QR Code Pairing**: Pair with desktop in 3 seconds.
          files: packages/mobile/build/tabvault-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
